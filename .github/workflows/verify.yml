name: Java verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: bash build.sh
      - run: mvn -B -f .deps/oracle-ai-database-fullstack-toolkit/upstream/oracle-db-mcp-java-toolkit/pom.xml package
      - run: python3 scripts/check-mcp-catalog.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/target/surefire-reports/'
